<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SS Bal Sadan School</title>
    <meta name="description" content="SS Bal Sadan School — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="SS Bal Sadan School" />
    <meta property="og:description" content="SS Bal Sadan School — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SS Bal Sadan School" />
    <meta name="twitter:description" content="SS Bal Sadan School — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Preload the first hero image so the browser fetches it immediately from
      HTML — before React loads, before any JS executes. This is the single
      biggest lever for LCP on a JS-rendered React site: without this, the
      browser can't discover the image URL until the 461 KB bundle parses and
      React renders the <img> tag (~3-4 s delay).
    -->
    <link
      rel="preload"
      as="image"
      href="/school-front.webp"
      imagesrcset="/school-front-480w.webp 480w, /school-front-800w.webp 800w, /school-front.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <!-- Preconnect to Google Fonts CDN for faster DNS + TLS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load Lato + Poppins asynchronously — does NOT block rendering -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Poppins:wght@300;400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Poppins:wght@300;400;500;600;700;800&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
